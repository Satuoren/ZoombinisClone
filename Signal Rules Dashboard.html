<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Rules Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Researcher dashboard for Signal Rules. Load session files exported by the game (one player or many),
   and every table and chart here aggregates across all loaded players. Nothing leaves this page. */
:root{
  --bg:#edf1f4; --surface:#fbfcfd; --surface-2:#e4eaef; --ink:#14202e; --muted:#53647a; --line:#c6d1db;
  --accent:#2850c8; --on-accent:#ffffff; --accent-soft:#c9d6f8;
  --good:#17794f; --good-soft:#d6efe3; --bad:#b8372a; --bad-soft:#f8dcd7; --warn:#a86a00;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --fs-s:13px; --fs-b:15px; --fs-m:18px; --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1822; --surface:#16222f; --surface-2:#1e2d3d; --ink:#e6edf4; --muted:#9fb0c2; --line:#2c3e51;
    --accent:#86a2ff; --on-accent:#0b1220; --accent-soft:#2b3f73;
    --good:#4cc38a; --good-soft:#173a2b; --bad:#ff8068; --bad-soft:#47201b; --warn:#f0b44c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1822; --surface:#16222f; --surface-2:#1e2d3d; --ink:#e6edf4; --muted:#9fb0c2; --line:#2c3e51;
  --accent:#86a2ff; --on-accent:#0b1220; --accent-soft:#2b3f73;
  --good:#4cc38a; --good-soft:#173a2b; --bad:#ff8068; --bad-soft:#47201b; --warn:#f0b44c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-b);line-height:1.5;padding:18px 16px 40px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-0.01em;text-wrap:balance}
h1{font-size:clamp(22px,3vw,28px);font-weight:800}
h2{font-size:var(--fs-m);font-weight:700}
h3{font-size:var(--fs-b);font-weight:700}
p{margin:0}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:var(--fs-s)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:10px 18px;font-weight:600;min-height:44px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px}
.ghost:hover{border-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:38px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.loaded{font-size:var(--fs-s)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
.tile span{font-size:var(--fs-s);color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-s)}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--f-mono);font-size:12px}
tr.strong td{background:var(--good-soft)}
tr.strong td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.tier{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:6px;margin-top:4px}
.tier.strong{background:var(--good);color:var(--surface)}
.tier.partial{border:1px solid var(--line);color:var(--muted)}
tbody tr.pick{cursor:pointer}
tbody tr.pick:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--accent-soft)}
.ok{color:var(--good)} .no{color:var(--bad)}
/* progress bars: one bar per day; light part = players who tried it, dark part = players who cleared it */
.prog{display:grid;grid-template-columns:150px minmax(0,1fr) 170px;gap:8px 12px;align-items:center;font-size:var(--fs-s)}
.track{height:18px;position:relative}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.bar.tried{background:var(--accent-soft)}
.bar.cleared{background:var(--accent);border-right:2px solid var(--surface)}
.legend{display:flex;gap:16px;font-size:var(--fs-s);color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.strip{display:block}
.strip .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.strip .axis{stroke:var(--line)}
.strip .chance{stroke:var(--bad);stroke-dasharray:3 3}
.strip text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 8px;border-radius:7px;max-width:280px;display:none}
details summary{cursor:pointer;font-weight:600}
dl.dict{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:4px 14px;font-size:var(--fs-s);margin:8px 0 0}
dl.dict dt{font-family:var(--f-mono);font-size:12px}
dl.dict dd{margin:0;color:var(--muted)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
@media (max-width:700px){.prog{grid-template-columns:96px minmax(0,1fr)}.prog .lab2{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="kicker">Signal Rules · researcher dashboard</p>
      <h1>All players</h1>
    </div>
    <p class="hint">Data stays in this page. Nothing is uploaded.</p>
  </header>

  <section class="drop" id="drop" aria-label="Load data">
    <label class="primary" style="display:inline-flex;align-items:center;cursor:pointer">Choose session files<input id="files" type="file" accept=".json,application/json" multiple hidden></label>
    <button type="button" class="ghost" id="fromBrowser">Load sessions saved in this browser</button>
    <button type="button" class="ghost" id="clearAll">Clear</button>
    <p class="hint">Or drop files anywhere on this page. Use the files from <b>Download this session</b> or <b>Download all saved sessions</b> in the game’s Researcher view. Loading the same session twice keeps the newest copy.</p>
    <p class="loaded" id="loaded" role="status"></p>
  </section>

  <div id="out"></div>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
const median=xs=>{if(!xs.length)return null;const a=[...xs].sort((x,y)=>x-y),m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;};
const fmt=(x,d)=>x==null?'–':(+x).toFixed(d==null?1:d);
const STORE='signalRules.sessions.v1';
/* The game's days, in order. Keep in sync with LEVELS in Signal Rules.html. */
const DAYS=[{key:'quiet',day:'Training',name:'Quiet corner'},{key:'busy',day:'Day 1',name:'Busy main street'},{key:'rush',day:'Day 2',name:'Rush hour'},
  {key:'broken',day:'Day 3',name:'The broken light'},{key:'two',day:'Day 4',name:'Two lights'},{key:'three',day:'Day 5',name:'Three lights'},{key:'square',day:'Festival Day',name:'Gridlock square'}];
const CAUSE={pass:'3 stars',yellow:'too much yellow',starved:'a line starved at red',idle:'green with nobody to serve',spillback:'spillback from a full block',gridlock:'gridlock',other:'other'};

/* ===== Measures from attempt records. Copied from Signal Rules.html: keep the two identical. ===== */
function measuresFrom(atts){
  const WANT={yellow:1,starved:-1,idle:-1};
  const pairs=[],last={};
  for(const a of atts){const k=a.session_id+'|'+a.level;if(last[k])pairs.push([last[k],a]);last[k]=a;}
  const M={};
  const br=atts.filter(a=>a.level_key==='broken'),fix=br.find(a=>a.pass);
  M.debugging={runs:br.length,ran_given_first:br.length?br[0].parts_changed_from_given===0:null,fixed:!!fix,
    parts_changed:fix?fix.parts_changed_from_given:null,runs_to_fix:fix?br.indexOf(fix)+1:null,chance_one_part_fix:0.29};
  const ed=pairs.map(p=>p[1].parts_changed);
  M.one_change={edits:ed.filter(x=>x>0).length,one_part:ed.filter(x=>x===1).length,reruns_no_change:ed.filter(x=>x===0).length};
  M.one_change.share=M.one_change.edits?+(M.one_change.one_part/M.one_change.edits).toFixed(2):null;
  const dir={judged:0,right:0,wrong:0,unchanged:0,expected_by_chance:0};
  for(const [a,b] of pairs){const w=WANT[a.cause];if(!w)continue;
    const d=Math.sign(b.mean_green-a.mean_green);if(d===0){dir.unchanged++;continue;}
    dir.judged++;if(d===w)dir.right++;else dir.wrong++;
    const up=a.chance_longer,down=a.chance_shorter;dir.expected_by_chance+=up+down?(w>0?up:down)/(up+down):0.5;}
  dir.share=dir.judged?+(dir.right/dir.judged).toFixed(2):null;dir.expected_by_chance=+dir.expected_by_chance.toFixed(1);M.direction=dir;
  const fr=atts.filter(a=>a.level_key==='square'),g1=fr.findIndex(a=>a.gridlock_at!==null),after=g1>=0?fr.slice(g1+1):[];
  const ga=pairs.filter(p=>p[0].level_key==='square'&&p[0].cause==='gridlock'&&p[1].mean_green!==p[0].mean_green);
  M.gridlock={runs:fr.length,first_gridlock_run:g1>=0?g1+1:null,runs_after_first:after.length,gridlocked_after_first:after.filter(a=>a.gridlock_at!==null).length,
    chance:0.68,edits_after_gridlock:ga.length,shorter_greens_after_gridlock:ga.filter(p=>p[1].mean_green<p[0].mean_green).length};
  M.gridlock.rate_after_first=after.length?+(M.gridlock.gridlocked_after_first/after.length).toFixed(2):null;
  const cr=atts.filter(a=>(a.level_key==='two'||a.level_key==='three')&&a.pass);
  M.feedback={clearing_runs:cr.length,with_queue_sensor:cr.filter(a=>a.uses_queue).length};
  const sp=pairs.filter(p=>(p[0].level_key==='two'||p[0].level_key==='three')&&p[0].blocked_a_s>=6);
  M.interconnection={spillback_runs_with_next:sp.length,less_blocked_next:sp.filter(p=>p[1].blocked_a_s<p[0].blocked_a_s).length};
  return M;
}
/* ===== end of shared block ===== */

const sessions=new Map();let skipped=0;

/* ---------- loading ---------- */
function addData(x){
  if(!x)return;
  if(Array.isArray(x)){x.forEach(addData);return;}
  if(Array.isArray(x.sessions)){x.sessions.forEach(addData);return;}
  if(x.session&&Array.isArray(x.attempts)){
    const old=sessions.get(x.session);
    if(!old||(x.updated||'')>=(old.updated||''))sessions.set(x.session,x);
    return;
  }
  skipped++;
}
async function readFiles(list){
  let bad=0;
  for(const f of list){try{addData(JSON.parse(await f.text()));}catch(_){bad++;}}
  render(bad?bad+' file'+(bad===1?' was':'s were')+' not valid JSON.':'');
}
$('#files').addEventListener('change',e=>{readFiles([...e.target.files]);e.target.value='';});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$('#drop').classList.add('over');}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{if(t==='dragleave'&&e.relatedTarget)return;$('#drop').classList.remove('over');}));
document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)readFiles([...e.dataTransfer.files]);});
$('#fromBrowser').addEventListener('click',()=>{
  let all=null;try{all=JSON.parse(localStorage.getItem(STORE)||'null');}catch(_){}
  if(!all||!Object.keys(all).length){render('No saved sessions found in this browser. Browsers keep saved data separate per site and per file location, so download the sessions from the game and load the file instead.');return;}
  addData(Object.values(all));render('');
});
$('#clearAll').addEventListener('click',()=>{sessions.clear();skipped=0;sel.player='';render('');});

/* ---------- shaping ---------- */
function players(){
  const by=new Map();
  for(const s of sessions.values()){
    const id=s.player||(s.attempts[0]&&s.attempts[0].player_id)||'';
    const key=id||('no ID · '+s.session);
    if(!by.has(key))by.set(key,{id:key,hasId:!!id,sessions:[]});
    by.get(key).sessions.push(s);
  }
  return [...by.values()].map(p=>{
    p.sessions.sort((a,b)=>(a.started||'').localeCompare(b.started||''));
    p.attempts=p.sessions.flatMap(s=>[...s.attempts].sort((a,b)=>a.attempt_id-b.attempt_id).map(a=>Object.assign({},a,{player:p.id})));
    p.M=measuresFrom(p.attempts);
    p.days={};
    for(const d of DAYS){const at=p.attempts.filter(a=>a.level_key===d.key);if(!at.length)continue;
      const first=at.findIndex(a=>a.pass);p.days[d.key]={tried:at.length,cleared:first>=0,toClear:first>=0?first+1:null,best:Math.max(0,...at.map(a=>a.stars))};}
    p.cleared=Object.values(p.days).filter(x=>x.cleared).length;
    p.stars=Object.values(p.days).reduce((a,x)=>a+x.best,0);
    return p;
  }).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
}

/* ---------- small charts ---------- */
// Dot strip: one dot per player on a 0..1 (or -0.5..0.5) scale, with an optional dashed chance line.
function strip(points,opt){
  if(!points.length)return '<span class="hint">no players yet</span>';
  const W=240,H=38,pl=8,pr=8,lo=opt.lo,hi=opt.hi,X=v=>pl+(W-pl-pr)*(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo);
  const P=['<svg class="strip" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(opt.label)+'">',
    '<line class="axis" x1="'+pl+'" y1="18" x2="'+(W-pr)+'" y2="18"/>',
    '<text x="'+pl+'" y="35">'+esc(opt.loLab)+'</text><text x="'+(W-pr)+'" y="35" text-anchor="end">'+esc(opt.hiLab)+'</text>'];
  if(opt.chance!=null)P.push('<line class="chance" x1="'+X(opt.chance)+'" y1="4" x2="'+X(opt.chance)+'" y2="28"/><text x="'+X(opt.chance)+'" y="35" text-anchor="middle" style="fill:var(--bad)">'+esc(opt.chanceLab)+'</text>');
  const seen={};
  points.forEach(p=>{const x=X(p.v),k=Math.round(x/4);seen[k]=(seen[k]||0)+1;const y=18-((seen[k]-1)%3)*5*(seen[k]%2?1:-1);
    P.push('<circle class="dot" cx="'+x.toFixed(1)+'" cy="'+y+'" r="5" data-tip="'+esc(p.tip)+'"/>');});
  P.push('</svg>');return P.join('');
}

/* ---------- aggregate measures ---------- */
function aggregate(ps){
  const rows=[];
  const dbg=ps.filter(p=>p.M.debugging.runs),fixed=dbg.filter(p=>p.M.debugging.fixed),one=fixed.filter(p=>p.M.debugging.parts_changed===1);
  rows.push({tier:'strong',name:'CT: Debugging',sub:'Day 3: finds and fixes the fault in a given rule',
    n:dbg.length,
    result:dbg.length?one.length+' of '+fixed.length+' players who fixed it did so with a one-part change ('+pct(one.length,fixed.length)+'). '
      +dbg.filter(p=>p.M.debugging.ran_given_first).length+' of '+dbg.length+' ran the given rule before changing it. Median runs to fix: '+fmt(median(fixed.map(p=>p.M.debugging.runs_to_fix)),1)+'.':'–',
    chance:'29% of one-part changes fix the rule',
    viz:strip(fixed.map(p=>({v:Math.min(p.M.debugging.parts_changed,7),tip:p.id+': fixed with '+p.M.debugging.parts_changed+' part'+(p.M.debugging.parts_changed===1?'':'s')+' changed, '+p.M.debugging.runs_to_fix+' runs'})),
      {lo:1,hi:7,loLab:'1 part',hiLab:'7 parts',label:'Parts changed in each player’s fix'})});
  const sys=ps.filter(p=>p.M.one_change.edits>=3);
  rows.push({tier:'strong',name:'CT: Systematic testing',sub:'Changes one part between runs',
    n:sys.length,
    result:sys.length?'Median share of one-part edits: '+pct(median(sys.map(p=>p.M.one_change.share)),1)+'. '+sys.filter(p=>p.M.one_change.share>=0.5).length+' of '+sys.length+' players made at least half their edits one part at a time.':'–',
    chance:'Random edits: about 6% one-part in scripted tests',
    viz:strip(sys.map(p=>({v:p.M.one_change.share,tip:p.id+': '+p.M.one_change.one_part+' of '+p.M.one_change.edits+' edits one part'})),{lo:0,hi:1,loLab:'0%',hiLab:'100%',label:'Share of one-part edits per player'}),
    note:'Players with at least 3 edits.'});
  const gl=ps.filter(p=>p.M.gridlock.runs_after_first>0);
  rows.push({tier:'strong',name:'ST: Reinforcing loops',sub:'Festival Day: stops gridlocking after seeing it once',
    n:gl.length,
    result:gl.length?'Median gridlock rate after the first gridlock: '+pct(median(gl.map(p=>p.M.gridlock.rate_after_first)),1)+'. '+gl.filter(p=>p.M.gridlock.rate_after_first<0.68).length+' of '+gl.length+' players stayed below chance.':'–',
    chance:'68% of all rules gridlock',
    viz:strip(gl.map(p=>({v:p.M.gridlock.rate_after_first,tip:p.id+': '+p.M.gridlock.gridlocked_after_first+' of '+p.M.gridlock.runs_after_first+' later runs gridlocked'})),{lo:0,hi:1,loLab:'0%',hiLab:'100%',chance:0.68,chanceLab:'68%',label:'Gridlock rate after the first gridlock'}),
    note:'Players who gridlocked and ran again.'});
  const dr=ps.filter(p=>p.M.direction.judged>=3);
  const tr=ps.reduce((a,p)=>a+p.M.direction.right,0),tj=ps.reduce((a,p)=>a+p.M.direction.judged,0),te=ps.reduce((a,p)=>a+p.M.direction.expected_by_chance,0);
  rows.push({tier:'partial',name:'ST: Stocks and flows',sub:'Moves the green the right way after a run with a clear problem',
    n:dr.length,
    result:tj?tr+' of '+tj+' edits went the right way; random rules would manage about '+fmt(te,1)+'.':'–',
    chance:'Worked out per edit; about 70% on average',
    viz:strip(dr.map(p=>{const d=p.M.direction;return{v:(d.right-d.expected_by_chance)/d.judged,tip:p.id+': '+d.right+' of '+d.judged+' right, chance '+d.expected_by_chance};}),{lo:-0.5,hi:0.5,loLab:'−50 pts',hiLab:'+50 pts',chance:0,chanceLab:'chance',label:'Right-direction edits above chance, per player'}),
    note:'Limit: random play also lands slightly above chance. Do not rank players on it.'});
  const fb=ps.filter(p=>p.M.feedback.clearing_runs);
  rows.push({tier:'partial',name:'ST: Feedback',sub:'Days 4–5: clears with a rule that reacts to the lines',
    n:fb.length,
    result:fb.length?fb.filter(p=>p.M.feedback.with_queue_sensor===p.M.feedback.clearing_runs).length+' of '+fb.length+' players used a queue sensor in every clearing run.':'–',
    chance:'Clock-only rules: 189 of 707 clearing rules',
    viz:strip(fb.map(p=>({v:p.M.feedback.with_queue_sensor/p.M.feedback.clearing_runs,tip:p.id+': '+p.M.feedback.with_queue_sensor+' of '+p.M.feedback.clearing_runs+' clearing runs'})),{lo:0,hi:1,loLab:'0%',hiLab:'100%',label:'Share of clearing runs with a queue sensor'}),
    note:'Limit: shows responsive control, not understanding of the loop.'});
  const ic=ps.filter(p=>p.M.interconnection.spillback_runs_with_next);
  rows.push({tier:'partial',name:'ST: Interconnection',sub:'Days 4–5: reduces spillback after seeing it',
    n:ic.length,
    result:ic.length?'Next run less blocked after '+ic.reduce((a,p)=>a+p.M.interconnection.less_blocked_next,0)+' of '+ic.reduce((a,p)=>a+p.M.interconnection.spillback_runs_with_next,0)+' spillback runs.':'–',
    chance:'Not computed',
    viz:strip(ic.map(p=>({v:p.M.interconnection.less_blocked_next/p.M.interconnection.spillback_runs_with_next,tip:p.id+': '+p.M.interconnection.less_blocked_next+' of '+p.M.interconnection.spillback_runs_with_next})),{lo:0,hi:1,loLab:'0%',hiLab:'100%',label:'Share of spillback runs followed by less blocking'}),
    note:'Limit: after a badly blocked run, almost any change blocks less.'});
  return rows;
}

/* ---------- CSV ---------- */
const ATT_COLS=['player','session_id','attempt_id','day','level','level_key','attempt_in_level','visit','at','sec_in_level','rule_text','s1','v1','op','s2','v2','conditions','uses_queue',
  'parts_changed','parts_changed_from_given','pass','stars','avg_wait','turned_away','gridlock_at','cause','mean_green','chance_longer','chance_shorter','yellow_share','idle_s','blocked_s','blocked_a_s','boxed_s','speed','skipped_to_end','pauses','steps'];
const csvCell=v=>{if(v==null)return '';const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const toCSV=(cols,rows)=>[cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\n');
function playerRow(p){
  const M=p.M,r={player:p.id,sessions:p.sessions.length,attempts:p.attempts.length,days_cleared:p.cleared,stars:p.stars,
    debug_ran_given_first:M.debugging.ran_given_first,debug_fixed:M.debugging.fixed,debug_parts_changed:M.debugging.parts_changed,debug_runs_to_fix:M.debugging.runs_to_fix,
    edits:M.one_change.edits,one_part_edits:M.one_change.one_part,one_part_share:M.one_change.share,reruns_no_change:M.one_change.reruns_no_change,
    gridlock_first_run:M.gridlock.first_gridlock_run,gridlock_runs_after_first:M.gridlock.runs_after_first,gridlock_rate_after_first:M.gridlock.rate_after_first,
    direction_judged:M.direction.judged,direction_right:M.direction.right,direction_expected_by_chance:M.direction.expected_by_chance,
    feedback_clearing_runs:M.feedback.clearing_runs,feedback_with_queue:M.feedback.with_queue_sensor,
    spillback_runs:M.interconnection.spillback_runs_with_next,spillback_less_blocked_next:M.interconnection.less_blocked_next};
  DAYS.forEach(d=>{const x=p.days[d.key];r['runs_'+d.key]=x?x.tried:'';r['runs_to_clear_'+d.key]=x&&x.toClear?x.toClear:'';r['stars_'+d.key]=x?x.best:'';});
  return r;
}
function save(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
const stamp=()=>new Date().toISOString().slice(0,10);

/* ---------- render ---------- */
const sel={player:'',day:'',outcome:''};
let PS=[];
function render(msg){
  PS=players();
  const nA=PS.reduce((a,p)=>a+p.attempts.length,0);
  $('#loaded').innerHTML=(sessions.size?'<b>'+sessions.size+'</b> session'+(sessions.size===1?'':'s')+' from <b>'+PS.length+'</b> player'+(PS.length===1?'':'s')+', <b>'+nA+'</b> attempts.':'Nothing loaded yet.')
    +(skipped?' Skipped '+skipped+' item'+(skipped===1?'':'s')+' with no attempt records (exported before version 6).':'')+(msg?' '+esc(msg):'');
  if(!sessions.size){$('#out').innerHTML='<div class="card empty">Load one or more session files to see the results for all players.</div>';return;}
  const finished=PS.filter(p=>p.days.square&&p.days.square.cleared).length;
  const H=[];
  H.push('<div class="tiles">'
    +tile(PS.length,'players')+tile(sessions.size,'sessions')+tile(nA,'attempts')
    +tile(fmt(median(PS.map(p=>p.attempts.length)),0),'median attempts per player')
    +tile(finished,'cleared Festival Day')+'</div>');

  // progress by day
  const N=PS.length;
  H.push('<section class="card"><div><h2>Progress by day</h2><p class="hint">Bar length is out of all '+N+' player'+(N===1?'':'s')+'. Hover a bar for details.</p></div>'
    +'<div class="legend"><span><i style="background:var(--accent-soft)"></i>tried</span><span><i style="background:var(--accent)"></i>cleared</span></div><div class="prog">'
    +DAYS.map(d=>{const t=PS.filter(p=>p.days[d.key]),c=t.filter(p=>p.days[d.key].cleared),med=median(c.map(p=>p.days[d.key].toClear));
      const tip=d.day+': '+t.length+' tried, '+c.length+' cleared'+(c.length?', median '+fmt(med,1)+' runs to clear':'');
      return '<span><b>'+esc(d.day)+'</b><br><span class="hint">'+esc(d.name)+'</span></span>'
        +'<div class="track" data-tip="'+esc(tip)+'"><div class="bar tried" style="width:'+(100*t.length/N)+'%"></div><div class="bar cleared" style="width:'+(100*c.length/N)+'%"></div></div>'
        +'<span class="lab2 hint">'+c.length+' of '+t.length+' cleared'+(c.length?' · median '+fmt(med,1)+' runs':'')+'</span>';}).join('')+'</div>'
    +'<div class="tablewrap"><table><thead><tr><th>Day</th><th class="num">Tried</th><th class="num">Cleared</th><th class="num">Median runs to clear</th><th class="num">Median best stars</th><th>Most common problem in failed or low-star runs</th></tr></thead><tbody>'
    +DAYS.map(d=>{const t=PS.filter(p=>p.days[d.key]),c=t.filter(p=>p.days[d.key].cleared);
      const causes={};PS.forEach(p=>p.attempts.filter(a=>a.level_key===d.key&&a.cause!=='pass').forEach(a=>{causes[a.cause]=(causes[a.cause]||0)+1;}));
      const top=Object.entries(causes).sort((a,b)=>b[1]-a[1])[0];
      return '<tr><td>'+esc(d.day)+': '+esc(d.name)+'</td><td class="num">'+t.length+'</td><td class="num">'+c.length+'</td><td class="num">'+fmt(median(c.map(p=>p.days[d.key].toClear)),1)+'</td><td class="num">'+fmt(median(t.map(p=>p.days[d.key].best)),1)+'</td><td>'+(top?esc(CAUSE[top[0]]||top[0])+' ('+top[1]+' runs)':'–')+'</td></tr>';}).join('')
    +'</tbody></table></div></section>');

  // skills
  H.push('<section class="card"><div><h2>Skill measures</h2><p class="hint">Highlighted rows are strong measures: the game gives a real choice and the result can be compared with random play. Partial rows carry the limit shown. Each dot is one player; hover it for details.</p></div>'
    +'<div class="tablewrap"><table><thead><tr><th>Measure</th><th class="num">Players</th><th>Result across players</th><th>Each player</th><th>Chance or reference</th></tr></thead><tbody>'
    +aggregate(PS).map(r=>'<tr class="'+r.tier+'"><td><b>'+r.name+'</b><br><span class="hint">'+r.sub+'</span><br><span class="tier '+r.tier+'">'+(r.tier==='strong'?'Strong':'Partial')+'</span></td><td class="num">'+r.n+'</td><td>'+esc(r.result)+(r.note?'<br><span class="hint">'+esc(r.note)+'</span>':'')+'</td><td>'+r.viz+'</td><td class="hint">'+esc(r.chance)+'</td></tr>').join('')
    +'</tbody></table></div></section>');

  // players
  H.push('<section class="card"><div><h2>Players</h2><p class="hint">Click a player to show only their attempts below.</p></div><div class="tablewrap"><table><thead><tr>'
    +'<th>Player</th><th class="num">Sessions</th><th class="num">Attempts</th><th class="num">Days cleared</th><th class="num">Stars</th><th>Day 3 fix</th><th class="num">One-part edits</th><th>Gridlock after first</th><th class="num">Right-way edits</th><th class="num">Queue sensor, Days 4–5</th></tr></thead><tbody>'
    +PS.map(p=>{const M=p.M,d=M.debugging,g=M.gridlock,o=M.one_change,r=M.direction,f=M.feedback;
      return '<tr class="pick'+(sel.player===p.id?' sel':'')+'" data-player="'+esc(p.id)+'" tabindex="0"><td>'+esc(p.id)+'</td><td class="num">'+p.sessions.length+'</td><td class="num">'+p.attempts.length+'</td><td class="num">'+p.cleared+' / '+DAYS.length+'</td><td class="num">'+p.stars+'</td>'
        +'<td>'+(!d.runs?'–':d.fixed?(d.parts_changed===1?'<span class="ok">1 part</span>':d.parts_changed+' parts')+', '+d.runs_to_fix+' run'+(d.runs_to_fix===1?'':'s')+(d.ran_given_first?'':', did not run it first'):'<span class="no">not fixed</span> ('+d.runs+')')+'</td>'
        +'<td class="num">'+(o.edits?pct(o.one_part,o.edits)+' <span class="hint">('+o.edits+')</span>':'–')+'</td>'
        +'<td>'+(g.first_gridlock_run===null?(g.runs?'never':'–'):(g.runs_after_first?g.gridlocked_after_first+' of '+g.runs_after_first:'no later runs'))+'</td>'
        +'<td class="num">'+(r.judged?r.right+' / '+r.judged+' <span class="hint">(chance '+r.expected_by_chance+')</span>':'–')+'</td>'
        +'<td class="num">'+(f.clearing_runs?f.with_queue_sensor+' / '+f.clearing_runs:'–')+'</td></tr>';}).join('')
    +'</tbody></table></div></section>');

  // clearing rules
  H.push('<section class="card"><div><h2>Rules that cleared each day</h2><p class="hint">The first clearing rule of each player, most common first.</p></div><div class="tablewrap"><table><thead><tr><th>Day</th><th>Rule (switch when …)</th><th class="num">Players</th><th class="num">Median stars</th></tr></thead><tbody>'
    +DAYS.map(d=>{const c={};PS.forEach(p=>{const a=p.attempts.find(x=>x.level_key===d.key&&x.pass);if(a){(c[a.rule_text]=c[a.rule_text]||[]).push(a.stars);}});
      const top=Object.entries(c).sort((a,b)=>b[1].length-a[1].length).slice(0,4);
      return top.map((t,i)=>'<tr><td>'+(i?'':esc(d.day))+'</td><td>'+esc(t[0])+'</td><td class="num">'+t[1].length+'</td><td class="num">'+fmt(median(t[1]),0)+'</td></tr>').join('')||'<tr><td>'+esc(d.day)+'</td><td class="hint" colspan="3">nobody cleared it yet</td></tr>';}).join('')
    +'</tbody></table></div></section>');

  // attempts
  H.push('<section class="card"><div><h2>Every attempt</h2><p class="hint">One row per run of the lights.</p></div><div class="btnrow">'
    +'<label class="hint">Player <select id="fPlayer"><option value="">All players</option>'+PS.map(p=>'<option'+(sel.player===p.id?' selected':'')+'>'+esc(p.id)+'</option>').join('')+'</select></label>'
    +'<label class="hint">Day <select id="fDay"><option value="">All days</option>'+DAYS.map(d=>'<option value="'+d.key+'"'+(sel.day===d.key?' selected':'')+'>'+esc(d.day)+'</option>').join('')+'</select></label>'
    +'<label class="hint">Result <select id="fOut"><option value="">All results</option>'+[['cleared','Cleared'],['failed','Failed'],['gridlock','Gridlock']].map(o=>'<option value="'+o[0]+'"'+(sel.outcome===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>'
    +'</div><div id="attTable"></div></section>');

  // export + dictionary
  H.push('<section class="card"><h2>Export</h2><div class="btnrow"><button type="button" class="ghost" id="xAtt">Attempts (CSV)</button><button type="button" class="ghost" id="xPl">Players and measures (CSV)</button><button type="button" class="ghost" id="xJson">All sessions combined (JSON)</button></div>'
    +'<details><summary>What each attempt column means</summary><dl class="dict">'
    +[['player','Player ID, or “no ID” plus the session'],['attempt_id','Order of the attempt within its session'],['attempt_in_level','Attempt number on that day, across visits'],['visit','How many times the player had opened that day'],['sec_in_level','Seconds since the player opened the day'],
      ['rule_text / s1 v1 op s2 v2','The rule. Sensors: gt green time (≥), rq cars waiting at red (≥), gq cars waiting at green (≤)'],['uses_queue','The rule reads a line of cars, not only the clock'],
      ['parts_changed','Parts of the rule changed since the previous attempt on the same day (0 = rerun, blank = first)'],['parts_changed_from_given','Day 3 only: parts changed from the broken rule'],
      ['pass / stars','Cleared (nobody turned away, no gridlock) and stars earned'],['avg_wait','Average wait per car, in seconds'],['gridlock_at','Second the square locked up, if it did'],
      ['cause','Main problem: yellow (greens too short), starved (a line waited at red too long), idle (green with nobody to serve), spillback, gridlock, other, or pass (3 stars)'],
      ['mean_green','Average length of a green, in seconds'],['chance_longer / chance_shorter','Share of all possible rules on that day with a longer or shorter average green'],
      ['yellow_share','Share of the run the lights spent on yellow'],['idle_s / blocked_s / blocked_a_s / boxed_s','Seconds of green with nobody to serve; green but blocked ahead (all lights / light A); cars stuck in an intersection'],
      ['speed / skipped_to_end / pauses / steps','How the player watched the run']]
      .map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl></details></section>');

  $('#out').innerHTML=H.join('');
  renderAttempts();
  $('#fPlayer').addEventListener('change',e=>{sel.player=e.target.value;render('');});
  $('#fDay').addEventListener('change',e=>{sel.day=e.target.value;renderAttempts();});
  $('#fOut').addEventListener('change',e=>{sel.outcome=e.target.value;renderAttempts();});
  $('#xAtt').addEventListener('click',()=>save('signal-rules-attempts-'+stamp()+'.csv',toCSV(ATT_COLS,PS.flatMap(p=>p.attempts)),'text/csv'));
  $('#xPl').addEventListener('click',()=>{const rows=PS.map(playerRow);save('signal-rules-players-'+stamp()+'.csv',toCSV(Object.keys(rows[0]),rows),'text/csv');});
  $('#xJson').addEventListener('click',()=>save('signal-rules-sessions-'+stamp()+'.json',JSON.stringify({game:'Signal Rules',exported:new Date().toISOString(),sessions:[...sessions.values()]}),'application/json'));
}
const tile=(v,l)=>'<div class="tile"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>';
function renderAttempts(){
  let rows=PS.filter(p=>!sel.player||p.id===sel.player).flatMap(p=>p.attempts);
  if(sel.day)rows=rows.filter(a=>a.level_key===sel.day);
  if(sel.outcome==='cleared')rows=rows.filter(a=>a.pass);else if(sel.outcome==='failed')rows=rows.filter(a=>!a.pass);else if(sel.outcome==='gridlock')rows=rows.filter(a=>a.gridlock_at!==null);
  const LIM=500,shown=rows.slice(0,LIM);
  $('#attTable').innerHTML='<p class="hint">'+rows.length+' attempt'+(rows.length===1?'':'s')+(rows.length>LIM?', showing the first '+LIM+'. Export the CSV for all of them.':'')+'</p>'
    +'<div class="tablewrap" style="max-height:520px"><table><thead><tr><th>Player</th><th>Day</th><th class="num">#</th><th class="num">Time</th><th>Rule (switch when …)</th><th class="num">Changed</th><th>Result</th><th class="num">Wait</th><th>Main problem</th><th class="num">Avg green</th><th>Watched</th></tr></thead><tbody>'
    +shown.map(a=>'<tr><td>'+esc(a.player)+'</td><td>'+esc(a.day)+'</td><td class="num">'+a.attempt_in_level+'</td><td class="num">'+a.sec_in_level+' s</td><td>'+esc(a.rule_text)+'</td>'
      +'<td class="num">'+(a.parts_changed==null?'first':a.parts_changed)+(a.parts_changed_from_given!=null?' <span class="hint">('+a.parts_changed_from_given+' from given)</span>':'')+'</td>'
      +'<td>'+(a.gridlock_at!==null?'<span class="no">gridlock at '+a.gridlock_at+' s</span>':a.pass?'<span class="ok">'+'★'.repeat(a.stars)+'</span>':'<span class="no">'+a.turned_away+' turned away</span>')+'</td>'
      +'<td class="num">'+fmt(a.avg_wait,1)+' s</td><td>'+esc(CAUSE[a.cause]||a.cause)+'</td><td class="num">'+fmt(a.mean_green,1)+' s</td>'
      +'<td class="hint">'+(a.skipped_to_end?'skipped':a.speed)+(a.pauses?', '+a.pauses+' pause'+(a.pauses===1?'':'s'):'')+(a.steps?', '+a.steps+' step'+(a.steps===1?'':'s'):'')+'</td></tr>').join('')
    +'</tbody></table></div>';
}
$('#out').addEventListener('click',e=>{const r=e.target.closest('[data-player]');if(!r)return;sel.player=sel.player===r.dataset.player?'':r.dataset.player;render('');});
$('#out').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const r=e.target.closest('[data-player]');if(r){sel.player=sel.player===r.dataset.player?'':r.dataset.player;render('');}});

/* tooltip */
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.display='none';return;}tip.textContent=t.getAttribute('data-tip');tip.style.display='block';});
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(innerWidth-290,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px';}});

window.SignalRulesDashboard={addData:addData,render:render};
render('');
})();
</script>
</body>
</html>
